<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winery Loss App</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont;
  background: #f2f2f7;
  margin: 0;
}

.app {
  max-width: 430px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

table {
  width: 100%;
  font-size: 12px;
}

th, td {
  text-align: center;
  padding: 5px;
}

button {
  width: 100%;
  padding: 10px;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
}

.main-btn {
  background: #007aff;
  color: white;
  font-weight: bold;
}

.loss {
  color: red;
  font-weight: bold;
}

.good { color: green; }
.bad { color: red; }

</style>
</head>

<body>

<div class="app">

  <h2>🍷 Loss Reconciliation</h2>

  <div class="card">
    <input id="galPerBarrel" placeholder="Gal per Barrel" value="59">
    <input id="lees" placeholder="Total Lees" value="15">
    <input id="target" placeholder="Final Target" value="8662">
  </div>

  <div class="card">
    <table id="lotesTable">
      <tr>
        <th>#</th>
        <th>Br</th>
        <th>Base</th>
        <th>Lees</th>
        <th>Adj</th>
        <th>Loss</th>
        <th>Total</th>
      </tr>
    </table>

    <button onclick="addLote()">+ Lote</button>
  </div>

  <div class="card">
    <table id="contTable">
      <tr><th>Containers</th></tr>
    </table>

    <button onclick="addContainer()">+ Container</button>
  </div>

  <button class="main-btn" onclick="calculate()">Calcular</button>

  <div id="report" class="card"></div>

</div>

<script>

// Add lote
function addLote() {
  const table = document.getElementById("lotesTable");
  const row = table.insertRow();
  const index = table.rows.length - 1;

  row.innerHTML = `
    <td>${index}</td>
    <td><input type="number" value="0"></td>
    <td></td>
    <td></td>
    <td></td>
    <td></td>
    <td></td>
  `;
}

// Add container
function addContainer() {
  const table = document.getElementById("contTable");
  const row = table.insertRow();
  row.innerHTML = `<td><input type="number" value="0"></td>`;
}

// Calculate
function calculate() {

  const gal = parseFloat(document.getElementById("galPerBarrel").value) || 0;
  const lees = parseFloat(document.getElementById("lees").value) || 0;
  const targetVal = parseFloat(document.getElementById("target").value) || 0;

  const rows = document.getElementById("lotesTable").rows;

  let totalBarrels = 0;

  // total barrels
  for (let i = 1; i < rows.length; i++) {
    totalBarrels += parseFloat(rows[i].cells[1].children[0].value) || 0;
  }

  let baseTotal = 0;

  // base + lees
  for (let i = 1; i < rows.length; i++) {

    const br = parseFloat(rows[i].cells[1].children[0].value) || 0;

    const base = br * gal;
    const leesShare = totalBarrels ? -(br / totalBarrels) * lees : 0;
    const adj = base + leesShare;

    rows[i].cells[2].innerText = base.toFixed(1);
    rows[i].cells[3].innerText = leesShare.toFixed(1);
    rows[i].cells[4].innerText = adj.toFixed(1);

    baseTotal += adj;
  }

  // containers
  let contTotal = 0;
  const contRows = document.getElementById("contTable").rows;

  for (let i = 1; i < contRows.length; i++) {
    contTotal += parseFloat(contRows[i].cells[0].children[0].value) || 0;
  }

  // LOSS ONLY
  let lossTotal = (baseTotal + contTotal) - targetVal;
  if (lossTotal < 0) lossTotal = 0;

  let acc = 0;

  for (let i = 1; i < rows.length; i++) {

    const adj = parseFloat(rows[i].cells[4].innerText) || 0;

    const loss = baseTotal ? (adj / baseTotal) * lossTotal : 0;
    const total = adj - loss;

    acc += total;

    rows[i].cells[5].innerHTML =
      loss > 0 ? `<span class="loss">${loss.toFixed(1)}</span>` : "0.0";

    rows[i].cells[6].innerText = total.toFixed(1);
  }

  const final = acc + contTotal;
  const check = final - targetVal;

  document.getElementById("report").innerHTML = `
    <b>Total Lotes:</b> ${acc.toFixed(1)}<br>
    <b>Containers:</b> ${contTotal.toFixed(1)}<br>
    <b>Final:</b> ${final.toFixed(1)}<br>
    <b>Check:</b> 
    <span class="${Math.abs(check) < 0.1 ? 'good' : 'bad'}">
      ${check.toFixed(1)}
    </span>
  `;
}

// AUTO add one row so it works immediately
addLote();

</script>

</body>
</html>
